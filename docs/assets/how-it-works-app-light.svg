<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="470" viewBox="0 0 1330 470" role="img" aria-label="Porting a whole app: analyze plans it, you settle the decisions, app record captures the app's real behavior, the front door runs Rust in front of the original, units move over one by one until nothing falls back, then lift leaves a pure Rust app">
<rect x="0" y="40" width="200" height="150" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="20" y="74" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#b34a1a">PLAN</text>
<text x="20" y="110" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#1f2328">analyze</text>
<text x="20" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#59636e">Units, risks,</text>
<text x="20" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#59636e">dependencies.</text>
<rect x="265" y="40" width="200" height="150" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="285" y="74" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#b34a1a">YOU</text>
<text x="285" y="110" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#1f2328">decisions</text>
<text x="285" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#59636e">Settled before</text>
<text x="285" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#59636e">any code moves.</text>
<rect x="530" y="40" width="200" height="150" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="550" y="74" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#b34a1a">RECORD</text>
<text x="550" y="110" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="700" fill="#1f2328">app record</text>
<text x="550" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#59636e">The real CLI or</text>
<text x="550" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#59636e">HTTP behavior.</text>
<rect x="795" y="40" width="200" height="150" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="815" y="74" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#b34a1a">RUN</text>
<text x="815" y="110" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="700" fill="#1f2328">front-door</text>
<text x="815" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#59636e">Rust in front,</text>
<text x="815" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#59636e">the rest falls back.</text>
