<text x="582.0" y="363" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#1f2328">port</text>
<line x1="657.0" y1="356" x2="674.0" y2="356" stroke="#8c959f" stroke-width="2"/><path d="M673.0,350 L683.0,356 L673.0,362 Z" fill="#8c959f"/>
