<text x="758.0" y="363" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#1f2328">gate</text>
<line x1="833.0" y1="356" x2="850.0" y2="356" stroke="#8c959f" stroke-width="2"/><path d="M849.0,350 L859.0,356 L849.0,362 Z" fill="#8c959f"/>
<rect x="859.0" y="328" width="150" height="56" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="934.0" y="363" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#1f2328">wire</text>
<text x="670.0" y="418" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#59636e">app replay stays at 100% while fewer cases fall back</text>
<line x1="895.0" y1="190" x2="895.0" y2="261" stroke="#b34a1a" stroke-width="2"/><path d="M889.0,260 L895.0,270 L901.0,260 Z" fill="#b34a1a"/>
